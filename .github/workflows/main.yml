  ci:
    #needs: setup
    runs-on: windows-latest
    outputs:
      new_version: "${{ steps.tag_generator.outputs.new_version }}.0"
      new_version_tag: "v${{ steps.tag_generator.outputs.new_version }}.0"
      release_type: ${{ steps.og_tag_generator.outputs.new_version }} == ''
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm install
        working-directory: .github/config

      - name: Bump GitHub tag
        id: tag_generator
        uses: soumyamahunt/github-tag-action@test-other-ver-support
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          latest_ver: '1.2.3'
          dry_run: true
          default_bump: false

      - name: Bump GitHub tag og
        id: og_tag_generator
        uses: mathieudutour/github-tag-action@v5.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          append_to_pre_release_tag: '.5'
          release_branches: release
          pre_release_branches: master, main
          default_bump: false
          dry_run: true

      # - if: matrix.debug
      #   name: Check config type
      #   id: check_config
      #   shell: pwsh
      #   run: |
      #     echo "Debug configuration check succeded"

      - name: Use config type
        id: use_config
        shell: pwsh
        run: |
          echo "Debug configuration check succeded"
          if ($env:DEBUG -eq 'true' ) {
              echo "This is debug config"
          } else {
              echo "This is not debug config"
          }
          if ($env:RELEASE -eq 'true' ) {
              echo "This is release config"
          } else {
              echo "This is not release config"
          }
          echo "$env:MATRIX"
        env:
          DEBUG: ${{ matrix.debug }}
          RELEASE: ${{ matrix.release == 'release' || true }}
          MATRIX: ${{ toJson(github.event.inputs.matrix) }}

      - name: Update tags
        id: update_tag
        shell: pwsh
        run: |
          echo "New version is $env:NEW_VERSION"
          echo "New tag is $env:NEW_VERSION_TAG"
          echo "OG New version is $env:OG_NEW_VERSION"
          echo "OG New tag is $env:OG_NEW_VERSION_TAG"
          echo "OG release type is $env:RELEASE_TYPE"
        env:
          NEW_VERSION: "${{ steps.tag_generator.outputs.new_version }}.0"
          NEW_VERSION_TAG: "v${{ steps.tag_generator.outputs.new_version }}.0"
          OG_NEW_VERSION: "${{ steps.og_tag_generator.outputs.new_version }}.0"
          OG_NEW_VERSION_TAG: "v${{ steps.og_tag_generator.outputs.new_version }}.0"
          RELEASE_TYPE: "${{ steps.og_tag_generator.outputs.release_type }}"
          
      - name: Conventional Changelog Action
        id: auto_changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          github-token: ${{ secrets.github_token }}
          skip-version-file: "true"
          pre-changelog-generation: '.github/config/pre_changelog_hook.js'
          config-file-path: '.github/config/config.js'

      - name: Print conventional changelog
        id: print_conventional_changelog
        shell: pwsh
        run: |
          echo "$env:TAG"
          echo "$env:VERSION"
          echo "$env:CHANGELOG"
        env:
          CHANGELOG: ${{ steps.auto_changelog.outputs.changelog }}
          TAG: ${{ steps.auto_changelog.outputs.tag }}
          VERSION: ${{ steps.auto_changelog.outputs.version }}

      - name: Print changelog
        id: print_changelog
        shell: pwsh
        run: |
          echo "$env:CHANGELOG"
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          
      - name: Get tag
        id: get_tag
        run: |
          echo "::set-output name=tag::$(git describe --abbrev=0 --tags || git rev-list --max-parents=0 HEAD)" 

      - name: Universal changelog
        id: universal_changelog
        uses: soumyamahunt/universal-changelog-action@master
        with:
          previousReleaseTagNameOrSha: ${{ steps.get_tag.outputs.tag }}
          nextReleaseTagName: ${{ github.sha }}
          nextReleaseName: Test release
          configFilePath: .github/release.json

      - name: Print universal changelog
        id: print_universal_changelog
        shell: pwsh
        run: |
          echo "$env:CHANGELOG"
        env:
          CHANGELOG: ${{ steps.universal_changelog.outputs.changelog }}

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v1.7.1
        with:
          fromTag: ${{ steps.get_tag.outputs.tag }}
          toTag: ${{ github.sha }}
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Print changelog
        id: print_builder_changelog
        shell: pwsh
        run: |
          echo "$env:CHANGELOG"
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}

  cd:
    needs: ci
    runs-on: ubuntu-latest
    env:
      NEW_ASSEMBLY_VERSION: ${{ needs.ci.outputs.new_version }}
      NEW_TAG: ${{ needs.ci.outputs.new_version_tag }}
      RELEASE_TYPE: ${{ needs.ci.outputs.release_type }}
    steps:
      - name: Check output
        id: check_output
        run: |
          echo "New version is $env:NEW_ASSEMBLY_VERSION"
          echo "New tag is $env:NEW_TAG"
          echo "New tag is $env:RELEASE_TYPE"
          
      #- name: package-version-to-git-tag
      #  uses: pkgdeps/git-tag-action@v2
      #  with:
      #    github_token: ${{ secrets.GITHUB_TOKEN }}
      #    github_repo: ${{ github.repository }}
      #    git_commit_sha: ${{ github.sha }}
      #    version: "1.4.0.0"
